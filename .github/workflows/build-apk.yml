name: Build Bell APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub runner already has the Android SDK installed (ANDROID_HOME).

      - name: Install and prepare the app
        run: |
          npm ci
          npm run build

      - name: Build the APK
        id: build
        working-directory: android
        env:
          BELL_VERSION_CODE: ${{ github.run_number }}
          PW: ${{ secrets.BELL_KEYSTORE_PASSWORD }}
          KEY_B64: ${{ secrets.BELL_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          SIGNED=false
          if [ -n "$PW" ] && [ -n "$KEY_B64" ]; then
            # Ignore spaces or line breaks that sneak in when the secret is pasted on a phone.
            CLEAN="$(printf '%s' "$KEY_B64" | tr -cd 'A-Za-z0-9+/=')"
            PW="$(printf '%s' "$PW" | tr -d '[:space:]')"
            echo "Key secret: ${#CLEAN} usable characters (expected 3440). Password secret: ${#PW} characters (expected 32)."
            if printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/bell.keystore" 2>/dev/null \
               && keytool -list -keystore "$RUNNER_TEMP/bell.keystore" -storepass "$PW" >/dev/null 2>&1; then
              SIGNED=true
            else
              echo "::warning::The signing secrets could not be used. Check that BELL_KEYSTORE_BASE64 holds the whole long line and BELL_KEYSTORE_PASSWORD holds only the password. Making a test build instead."
            fi
          fi
          if [ "$SIGNED" = true ]; then
            # Signed with the same key every time, so each new APK installs over the old one.
            export BELL_KEYSTORE_FILE="$RUNNER_TEMP/bell.keystore"
            export BELL_KEYSTORE_PASSWORD="$PW" BELL_KEY_PASSWORD="$PW" BELL_KEY_ALIAS=bell
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Bell-1.${{ github.run_number }}.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Bell-test.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the test build
        if: steps.build.outputs.signed == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: Bell-test-apk
          path: Bell-test.apk

      - name: Publish the APK as a release
        if: steps.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" "Bell-1.${{ github.run_number }}.apk" \
            --title "Bell 1.${{ github.run_number }}" \
            --notes "Download Bell-1.${{ github.run_number }}.apk on your phone and tap it to install or update."
